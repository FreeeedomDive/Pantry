spring:
  application:
    name: pantry
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        concurrency: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 3s
          max-retries: 3
        observation-enabled: true
    template:
      observation-enabled: true

management:
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 25ms,50ms,100ms,250ms,500ms,1s,2s,5s
        "[http.client.requests]": 100ms,250ms,500ms,1s,2s,5s,10s,30s,60s
        "[spring.rabbit.listener]": 10ms,50ms,100ms,500ms,1s,5s,10s,30s,60s
        "[spring.rabbit.template]": 10ms,50ms,100ms,500ms,1s,5s,10s
        "[jvm.gc.pause]": 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        aggregation-temporality: cumulative
        base-time-unit: seconds
        step: 60s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  tracing:
    sampling:
      probability: 1.0
